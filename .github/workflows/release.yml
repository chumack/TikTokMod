name: Release

# A tag builds every platform and publishes them as one GitHub Release, so a
# version never exists for Windows without existing for Linux.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.4.0)'
        required: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_dispatch the tag is an input, and the build must run
          # on the commit that tag points to — not on the default branch.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # libfuse2 — AppImage runtime needs libfuse.so.2, absent on modern Ubuntu.
      #            (The package is called `fuse2` on Debian only — asking for it
      #            here fails with "Unable to locate package".)
      # libcrypt1 — the `fpm` binary electron-builder uses to emit .deb links
      #              against its own bundled Ruby.
      # xvfb     — the packaged selftest boots a real Electron window.
      - name: Install build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 xvfb libcrypt1 file

      - name: Install dependencies
        run: npm ci

      # --publish never: electron-builder otherwise detects CI and tries to
      # create a draft release itself, which fails without a token. The release
      # job below is the single place that talks to GitHub.
      - name: Build Linux packages
        run: npm run dist:linux -- --publish never

      - name: Verify the packaged app
        # Runs the app exactly as it was packaged — not the dev tree — so a
        # missing bundled binary or a broken resource path fails here instead
        # of on the user's machine.
        run: xvfb-run -a ./dist/linux-unpacked/tiktok-mod --selftest

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (installer + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: npm run dist:win -- --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      # The build jobs already ran on the tag; check the tag against
      # package.json so a release cannot be published under a name the code
      # does not declare.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the tag matches package.json
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node -e "
            const fs = require('node:fs');
            const tag = String(process.env.TAG).replace(/^refs\/tags\//, '').replace(/^v/, '');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (tag !== version) {
              console.error('tag ' + tag + ' does not match package.json ' + version);
              process.exit(1);
            }
            console.log('tag ' + tag + ' matches package.json');
          "

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          cd dist
          # Keep the unpacked app directories out of the release; everything
          # matching these extensions is a user-facing installer.
          #
          # Filenames are collected with mapfile/-d '' rather than $(find): the
          # Windows artifacts are named "TikTokMod Setup 0.3.1.exe", and word
          # splitting on a plain `gh release create $files` hands gh three
          # arguments and dies with "no matches found for `TikTokMod`".
          mapfile -d '' -t files < <(
            find . -maxdepth 1 -type f \
              \( -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' \
                 -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) \
              ! -name '*-unpacked*' \
              -print0
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts found — refusing to publish an empty release." >&2
            exit 1
          fi
          printf 'Releasing %s with:\n' "$TAG"
          printf '  %s\n' "${files[@]}"

          # Idempotent on purpose: a release workflow gets re-run (a failed
          # selftest, a corrected build, a manual dispatch on an existing tag),
          # and a plain `gh release create` aborts with "a release with the
          # same tag name already exists" instead of updating what is there.
          # Upload into an existing release and overwrite same-named assets.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading over it."
            gh release upload "$TAG" "${files[@]}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            # --verify-tag refuses to invent a tag that does not exist on the
            # remote — a manual dispatch with a typo'd name used to create one
            # out of the default branch's code.
            gh release create "$TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "TikTokMod $TAG" \
              --verify-tag \
              --generate-notes
          fi